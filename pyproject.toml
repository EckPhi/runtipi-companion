[project]
name = "runtipi-companion"
dynamic = ["version"]
description = "A containerized Runtipi app for verified backups through rclone."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Phil" }]
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "apprise>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.6.0", "pre-commit>=3.5.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Keep container build versions stable when building from an untagged commit.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/runtipi_companion"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Defaults (pyflakes + pycodestyle errors) plus import sorting, pyupgrade,
# and bugbear.
extend-select = ["I", "UP", "B"]
# Keep typing.Optional because the package supports Python 3.9, where
# ``X | None`` is not available at runtime.
ignore = ["UP007"]
